# Xcode project for the iPhone app, generated with XcodeGen (free):
#   brew install xcodegen && cd App && xcodegen && open Budget.xcodeproj
name: Budget
options:
  bundleIdPrefix: app.budget
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # set to your Apple ID team in Xcode > Signing to run on your iPhone
    CODE_SIGN_STYLE: Automatic
packages:
  BudgetKit:
    path: ..
targets:
  Budget:
    type: application
    platform: iOS
    sources: [Budget]
    dependencies:
      - package: BudgetKit
    info:
      path: Budget/Info.plist
      properties:
        CFBundleDisplayName: Budget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: "The camera is used to take photos of receipts. They are read on this phone."
        NSPhotoLibraryUsageDescription: "Pick a receipt photo you already took."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.budget.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
  BudgetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [BudgetUITests]
    dependencies:
      - target: Budget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.budget.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Budget
schemes:
  Budget:
    build:
      targets:
        Budget: all
        BudgetUITests: [test]
    test:
      targets:
        - BudgetUITests
      gatherCoverageData: true
