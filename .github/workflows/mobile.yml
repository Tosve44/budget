# The phone app (Flutter, iPhone + Android) in mobile/. Runs on GitHub's free machines
# (free and unlimited for public repositories): logic and sync tests, then the app on many
# Android emulators and iPhone simulators, then installable builds (APK and unsigned IPA).
name: Phone app

on:
  push:
    branches: [main]
    paths: ["mobile/**", "store.js", "receipt.js", "sync.js", "supabase/**", "tests/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/**", "store.js", "receipt.js", "sync.js", "supabase/**", "tests/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"

defaults:
  run:
    working-directory: mobile

jobs:
  logic:
    name: Logic, screens and sync (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Golden files still match the web app
        run: |
          node tool/make-golden.mjs ..
          git diff --exit-code --stat -- test/fixtures ':!test/fixtures/webdata.json' || echo "::warning::The web app's logic changed; golden files were regenerated for this run."
      - run: flutter analyze
      - name: Logic and golden tests
        run: flutter test test/golden_test.dart test/text_lines_test.dart test/category_icons_test.dart test/premium_test.dart
      - name: Screens on 12 phone sizes x 2 text sizes, and folding
        run: flutter test test/screens_test.dart test/fold_test.dart test/price_history_test.dart
      - name: Install PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-16 >/dev/null
          sudo systemctl stop postgresql || true
      - name: Start the test database and fake Supabase
        run: sudo -E env "PATH=$PATH" bash tool/start-test-backend.sh .. && sudo chmod -R a+rwX /tmp/budget-test-backend
      - name: Sync tests (two phones, the web app, flaky network)
        env:
          SUPABASE_TEST_URL: http://localhost:54321
          WEB_APP_DIR: ${{ github.workspace }}
          NODE_MODULES_DIR: /tmp/budget-test-backend/node_modules
          ICON_COLUMN: 'yes'
        run: flutter test test/sync_test.dart
      - name: Sync tests again on a database from before category icons
        env:
          SUPABASE_TEST_URL: http://localhost:54321
          ICON_COLUMN: 'no'
        run: |
          psql -h /tmp -p 54329 -U postgres -d budget_test -v ON_ERROR_STOP=1 -c "alter table public.categories drop column icon"
          flutter test test/sync_test.dart --plain-name 'category icons'

  android-build:
    name: Android test app (built once)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build the test app
        run: |
          for i in 1 2 3; do flutter build apk --debug -t integration_test/app_test.dart && break; echo "Retrying in 60 s"; sleep 60; done
          mkdir -p apks && cp build/app/outputs/flutter-apk/app-debug.apk apks/app-debug.apk
          # The six-months price tracking test (integration_test/price_test.dart), run by one job.
          for i in 1 2 3; do flutter build apk --debug -t integration_test/price_test.dart && break; echo "Retrying in 60 s"; sleep 60; done
          cp build/app/outputs/flutter-apk/app-debug.apk apks/price-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-test-app
          path: mobile/apks/

  android:
    name: Android ${{ matrix.android }} · ${{ matrix.name }}
    needs: [logic, android-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Small old phone (Nexus S, 4\")", profile: "Nexus S", api: 26, android: "8.0", font: "1.0", dark: "no" }
          - { name: "Pixel 2", profile: pixel_2, api: 28, android: "9", font: "1.0", dark: "no" }
          - { name: "Pixel 3a, large text", profile: pixel_3a, api: 29, android: "10", font: "1.3", dark: "no" }
          - { name: "Pixel 4, dark mode", profile: pixel_4, api: 30, android: "11", font: "1.0", dark: "yes" }
          - { name: "Pixel 5", profile: pixel_5, api: 31, android: "12", font: "1.0", dark: "no" }
          - { name: "Pixel 6", profile: pixel_6, api: 33, android: "13", font: "1.0", dark: "no" }
          - { name: "Pixel 7 Pro, largest text", profile: pixel_7_pro, api: 34, android: "14", font: "2.0", dark: "no" }
          - { name: "Pixel 8", profile: pixel_8, api: 35, android: "15", font: "1.0", dark: "no" }
          - { name: "Pixel 9 Pro XL", profile: pixel_9_pro_xl, api: 36, android: "16", font: "1.0", dark: "yes" }
          - { name: "Pixel Fold (foldable, open)", profile: pixel_fold, api: 34, android: "14", font: "1.0", dark: "no" }
          - { name: "Flip phone (6.7\" foldable)", profile: "6.7in Foldable", api: 34, android: "14", font: "1.0", dark: "no" }
          - { name: "Pixel Tablet", profile: pixel_tablet, api: 34, android: "14", font: "1.0", dark: "no" }
          - { name: "Small phone, large text (Pixel 4a)", profile: pixel_4a, api: 33, android: "13", font: "1.5", dark: "no" }
    steps:
      - uses: actions/checkout@v4
      - name: Allow the emulator to use the processor's virtualisation (KVM)
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - uses: actions/download-artifact@v4
        with:
          name: android-test-app
          path: mobile/test-app
      - name: Start the emulator
        run: bash tool/ci-android-emulator.sh "${{ matrix.api }}" "${{ matrix.profile }}"
      - name: Run on the emulator
        run: bash tool/ci-android-test.sh "${{ matrix.font }}" "${{ matrix.dark }}" device-test.log test-app/app-debug.apk
      - name: Summary
        if: always()
        env:
          TITLE: "Android ${{ matrix.android }} · ${{ matrix.name }}"
        run: |
          { echo "### $TITLE"; head -1 device-test.log 2>/dev/null;
            grep -E "(DEVICE|OCR|RESULT) " device-test.log 2>/dev/null | sed 's/^/    /';
            grep -E "All tests passed|Some tests failed|\[E\]" device-test.log 2>/dev/null | tail -15; } >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-${{ matrix.api }}-${{ strategy.job-index }}
          path: mobile/device-test.log

  prices-android:
    name: Price tracking, 6 months of receipt photos · Android 15 (Pixel 8)
    needs: [logic, android-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Allow the emulator to use the processor's virtualisation (KVM)
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - uses: actions/download-artifact@v4
        with:
          name: android-test-app
          path: mobile/test-app
      - name: Start the emulator
        run: bash tool/ci-android-emulator.sh 35 pixel_8
      - name: Run on the emulator
        run: bash tool/ci-android-test.sh 1.0 no device-test.log test-app/price-test.apk integration_test/price_test.dart
      - name: Summary
        if: always()
        run: |
          { echo "### Price tracking · Android 15 (Pixel 8)"; head -1 device-test.log 2>/dev/null;
            grep -E "(PRICES|RESULT) " device-test.log 2>/dev/null | sed 's/^/    /';
            grep -E "All tests passed|Some tests failed|\[E\]" device-test.log 2>/dev/null | tail -15; } >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prices-android
          path: mobile/device-test.log

  prices-iphone:
    name: Price tracking, 6 months of receipt photos · iOS 26 (iPhone 17 Pro)
    needs: logic
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Make the simulator
        run: |
          SIM="$(bash tool/ci-simulator.sh iPhone-17-Pro iOS-26)"
          echo "SIM=$SIM" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM" || true
          if ! xcrun simctl bootstatus "$SIM" -b || ! xcrun simctl list devices | grep "$SIM" | grep -q Booted; then
            xcrun simctl shutdown "$SIM" || true
            xcrun simctl erase "$SIM"
            xcrun simctl boot "$SIM"
            xcrun simctl bootstatus "$SIM" -b
          fi
      - name: Run on the simulator
        timeout-minutes: 70
        run: |
          set -o pipefail
          { echo "Simulator: iPhone 17 Pro | $(xcrun simctl list devices | grep "$SIM" | head -1 | xargs) | Xcode $(xcodebuild -version | sed -n 1p)"; } | tee device-test.log
          bash tool/ci-ios-test.sh "$SIM" device-test.log integration_test/price_test.dart
      - name: Summary
        if: always()
        run: |
          { echo "### Price tracking · iOS 26 (iPhone 17 Pro)"; head -1 device-test.log 2>/dev/null;
            grep -E "(PRICES|RESULT) " device-test.log 2>/dev/null | sed 's/^/    /';
            grep -E "All tests passed|Some tests failed|\[E\]" device-test.log 2>/dev/null | tail -15; } >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prices-iphone
          path: mobile/device-test.log

  iphone:
    name: iOS ${{ matrix.ios }} · ${{ matrix.name }}
    needs: logic
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "iPhone SE (3rd gen, small)", device: iPhone-SE-3rd-generation, ios: "18", runtime: "iOS-18", runner: macos-15 }
          - { name: "iPhone 16 Pro Max (large)", device: iPhone-16-Pro-Max, ios: "18", runtime: "iOS-18", runner: macos-15 }
          - { name: "iPhone 15", device: iPhone-15, ios: "17", runtime: "iOS-17-5", runner: macos-15 }
          - { name: "iPhone 17 Pro", device: iPhone-17-Pro, ios: "26", runtime: "iOS-26", runner: macos-26 }
          - { name: "iPhone 16e", device: iPhone-16e, ios: "26", runtime: "iOS-26", runner: macos-26 }
          - { name: "iPad (A16)", device: iPad-A16, ios: "26", runtime: "iOS-26", runner: macos-26 }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Make the simulator
        run: |
          SIM="$(bash tool/ci-simulator.sh ${{ matrix.device }} ${{ matrix.runtime }})"
          echo "SIM=$SIM" >> "$GITHUB_ENV"
          # A fresh simulator sometimes fails its first boot on the CI Macs; then it is wiped and
          # booted once more.
          xcrun simctl boot "$SIM" || true
          if ! xcrun simctl bootstatus "$SIM" -b || ! xcrun simctl list devices | grep "$SIM" | grep -q Booted; then
            echo "First boot failed; wiping the simulator and booting again"
            xcrun simctl shutdown "$SIM" || true
            xcrun simctl erase "$SIM"
            xcrun simctl boot "$SIM"
            xcrun simctl bootstatus "$SIM" -b
          fi
      - name: Run on the simulator
        timeout-minutes: 50
        run: |
          set -o pipefail
          { echo "Simulator: ${{ matrix.device }} | $(xcrun simctl list devices | grep "$SIM" | head -1 | xargs) | Xcode $(xcodebuild -version | sed -n 1p)"; } | tee device-test.log
          bash tool/ci-ios-test.sh "$SIM" device-test.log
      - name: Summary
        if: always()
        env:
          TITLE: "iOS ${{ matrix.ios }} · ${{ matrix.name }}"
        run: |
          { echo "### $TITLE"; head -1 device-test.log 2>/dev/null;
            grep -E "(DEVICE|OCR|RESULT) " device-test.log 2>/dev/null | sed 's/^/    /';
            grep -E "All tests passed|Some tests failed|\[E\]" device-test.log 2>/dev/null | tail -15; } >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-${{ matrix.ios }}-${{ strategy.job-index }}
          path: mobile/device-test.log

  iphone-duo:
    name: iPhone Duo (foldable), if GitHub's Macs have its simulator
    needs: logic
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Look for an iPhone Duo simulator in every Xcode on the Mac
        run: |
          echo "Xcodes on this Mac:"; ls -d /Applications/Xcode*.app
          FOUND=""
          for X in $(ls -d /Applications/Xcode*.app | sort -rV); do
            V="$(DEVELOPER_DIR=$X/Contents/Developer xcodebuild -version 2>/dev/null | head -1)"
            T="$(DEVELOPER_DIR=$X/Contents/Developer xcrun simctl list devicetypes 2>/dev/null | grep -i 'duo' || true)"
            echo "$X ($V): ${T:-no iPhone Duo}"
            if [ -n "$T" ] && [ -z "$FOUND" ]; then FOUND="$X"; DUO_TYPE="$(echo "$T" | head -1 | sed -E 's/.*\((com\.apple[^)]*)\).*/\1/')"; fi
          done
          if [ -z "$FOUND" ]; then
            echo "DUO=no" >> "$GITHUB_ENV"
            { echo "### iPhone Duo"; echo "No iPhone Duo simulator in any Xcode on GitHub's macos-26 Mac:"; ls -d /Applications/Xcode*.app | sed 's/^/    /'; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          sudo xcode-select -s "$FOUND/Contents/Developer"
          echo "DUO=yes" >> "$GITHUB_ENV"; echo "DUO_TYPE=$DUO_TYPE" >> "$GITHUB_ENV"
          echo "Using $FOUND, device type $DUO_TYPE"
          echo "simctl commands (looking for folding):"; xcrun simctl help | grep -iE 'fold|posture|hinge|ui ' || true
          xcrun simctl help ui 2>&1 | head -40 || true
      - uses: subosito/flutter-action@v2
        if: env.DUO == 'yes'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - if: env.DUO == 'yes'
        run: flutter pub get
      - name: Make the iPhone Duo simulator
        if: env.DUO == 'yes'
        run: |
          SIM="$(bash tool/ci-simulator.sh "${DUO_TYPE#com.apple.CoreSimulator.SimDeviceType.}")"
          echo "SIM=$SIM" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM" || true
          xcrun simctl bootstatus "$SIM" -b
      - name: Run on the iPhone Duo simulator
        if: env.DUO == 'yes'
        timeout-minutes: 40
        run: |
          set -o pipefail
          { echo "Simulator: iPhone Duo | $(xcrun simctl list devices | grep "$SIM" | head -1 | xargs) | Xcode $(xcodebuild -version | sed -n 1p)"; } | tee device-test.log
          bash tool/ci-ios-test.sh "$SIM" device-test.log
      - name: Summary
        if: always() && env.DUO == 'yes'
        run: |
          { echo "### iPhone Duo"; head -1 device-test.log 2>/dev/null;
            grep -E "(DEVICE|OCR|RESULT) " device-test.log 2>/dev/null | sed 's/^/    /';
            grep -E "All tests passed|Some tests failed|\[E\]" device-test.log 2>/dev/null | tail -15; } >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always() && env.DUO == 'yes'
        with:
          name: ios-iphone-duo
          path: mobile/device-test.log

  builds:
    name: Installable apps (APK + unsigned IPA)
    needs: logic
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - uses: gradle/actions/setup-gradle@v4
      - name: Android app (APK)
        run: for i in 1 2 3; do flutter build apk --release && break; sleep 60; done; test -f build/app/outputs/flutter-apk/app-release.apk
      - name: iPhone app (unsigned IPA, for Sideloadly / AltStore with a free Apple ID)
        run: |
          flutter build ios --release --no-codesign
          mkdir -p build/ipa/Payload && cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          (cd build/ipa && zip -qr Budget-unsigned.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: Budget-apps
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/ipa/Budget-unsigned.ipa
